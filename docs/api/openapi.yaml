openapi: 3.1.0
info:
  title: AI Research Knowledge Platform API
  version: 0.2.0
  description: >-
    Phase 0/1 permission-aware catalog contract with Phase 2 ingestion
    foundation and Phase 3/4 baseline APIs. Every response includes
    X-Request-ID. Successful JSON payloads and JSON errors repeat that same
    request ID.
servers:
  - url: /api/v1
security:
  - {}
  - sessionAuth: []
paths:
  /research-works:
    get:
      operationId: listResearchWorks
      summary: List research works visible to the caller
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - {name: q, in: query, schema: {type: string}}
        - {name: year, in: query, schema: {type: integer}}
        - {name: work_type, in: query, schema: {type: string}}
        - {name: language, in: query, schema: {type: string}}
      responses:
        "200":
          description: Permission-filtered results
          headers:
            X-Request-ID: {$ref: "#/components/headers/RequestId"}
          content:
            application/json:
              schema:
                type: object
                required: [count, results, request_id]
                properties:
                  count: {type: integer}
                  results: {type: array, items: {$ref: "#/components/schemas/ResearchWork"}}
                  request_id: {type: string}
        "405": {$ref: "#/components/responses/MethodNotAllowed"}
        "500": {$ref: "#/components/responses/InternalServerError"}
  /research-works/{id}:
    get:
      operationId: getResearchWork
      summary: Read a visible research work
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: Research work with visible advisors and governed taxonomy
          headers:
            X-Request-ID: {$ref: "#/components/headers/RequestId"}
        "404": {$ref: "#/components/responses/NotFound"}
        "405": {$ref: "#/components/responses/MethodNotAllowed"}
        "500": {$ref: "#/components/responses/InternalServerError"}
  /research-works/{id}/documents:
    post:
      operationId: uploadResearchWorkDocument
      security:
        - sessionAuth: []
      summary: Upload a validated source PDF
      description: >-
        Administrators may upload to any work. An active teacher may upload only
        to a work linked to their Professor profile through WorkAdvisor.
        Teacher uploads are forced to immutable teacher visibility; document
        promotion is intentionally not available in Phase 1.5.
        Unauthorized and missing works return the same 404. File metadata and
        storage URLs are not returned. CSRF protection applies to session clients.
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: {type: string, format: binary}
                visibility_scope:
                  allOf: [{$ref: "#/components/schemas/VisibilityScope"}]
                  description: Administrators may choose any scope; teachers may use only teacher.
      responses:
        "201":
          description: Source document and matching audit event committed
          headers:
            X-Request-ID: {$ref: "#/components/headers/RequestId"}
          content:
            application/json:
              schema:
                type: object
                required: [data, request_id]
                properties:
                  data:
                    type: object
                    required: [id, research_work_id, extraction_status, visibility_scope]
                    properties:
                      id: {type: string, format: uuid}
                      research_work_id: {type: string, format: uuid}
                      extraction_status: {type: string}
                      visibility_scope: {$ref: "#/components/schemas/VisibilityScope"}
                  request_id: {type: string}
        "400": {$ref: "#/components/responses/BadRequest"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "405": {$ref: "#/components/responses/MethodNotAllowed"}
        "500": {$ref: "#/components/responses/InternalServerError"}
  /ingestion-jobs:
    post:
      operationId: createIngestionJob
      security:
        - sessionAuth: []
      summary: Queue or requeue document ingestion
      description: Administrator-only endpoint. The job id is the SourceDocument id for the current ingestion baseline.
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [source_document_id]
              properties:
                source_document_id: {type: string, format: uuid}
      responses:
        "201":
          description: Source document queued for extraction
          headers:
            X-Request-ID: {$ref: "#/components/headers/RequestId"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "404": {$ref: "#/components/responses/NotFound"}
        "405": {$ref: "#/components/responses/MethodNotAllowed"}
        "500": {$ref: "#/components/responses/InternalServerError"}
  /ingestion-jobs/{id}:
    get:
      operationId: getIngestionJob
      security:
        - sessionAuth: []
      summary: Read ingestion status for a source document
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: Source document ingestion status
          headers:
            X-Request-ID: {$ref: "#/components/headers/RequestId"}
        "404": {$ref: "#/components/responses/NotFound"}
        "405": {$ref: "#/components/responses/MethodNotAllowed"}
        "500": {$ref: "#/components/responses/InternalServerError"}
  /professors:
    get:
      operationId: listProfessors
      summary: List visible active professors
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - {name: q, in: query, schema: {type: string}}
      responses:
        "200":
          description: Permission-filtered professor results
          headers:
            X-Request-ID: {$ref: "#/components/headers/RequestId"}
        "405": {$ref: "#/components/responses/MethodNotAllowed"}
        "500": {$ref: "#/components/responses/InternalServerError"}
  /professors/{id}:
    get:
      operationId: getProfessor
      summary: Read a visible professor and related visible works
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: Professor research profile
          headers:
            X-Request-ID: {$ref: "#/components/headers/RequestId"}
        "404": {$ref: "#/components/responses/NotFound"}
        "405": {$ref: "#/components/responses/MethodNotAllowed"}
        "500": {$ref: "#/components/responses/InternalServerError"}
  /fields/{id}:
    get:
      operationId: getResearchField
      summary: Read a visible research field and related visible works/professors
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: Research field page data
          headers:
            X-Request-ID: {$ref: "#/components/headers/RequestId"}
        "404": {$ref: "#/components/responses/NotFound"}
        "405": {$ref: "#/components/responses/MethodNotAllowed"}
        "500": {$ref: "#/components/responses/InternalServerError"}
  /methods/{id}:
    get:
      operationId: getResearchMethod
      summary: Read a visible research method and related visible works/professors
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: Research method page data
          headers:
            X-Request-ID: {$ref: "#/components/headers/RequestId"}
        "404": {$ref: "#/components/responses/NotFound"}
        "405": {$ref: "#/components/responses/MethodNotAllowed"}
        "500": {$ref: "#/components/responses/InternalServerError"}
  /search/semantic:
    post:
      operationId: semanticSearch
      summary: Permission-filtered semantic retrieval over available vector chunks
      parameters:
        - $ref: "#/components/parameters/RequestId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                q: {type: string}
                query: {type: string}
                limit: {type: integer, minimum: 1, maximum: 50}
      responses:
        "200":
          description: Ranked citations from visible vector chunks
          headers:
            X-Request-ID: {$ref: "#/components/headers/RequestId"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "405": {$ref: "#/components/responses/MethodNotAllowed"}
        "500": {$ref: "#/components/responses/InternalServerError"}
  /ai/teacher-matching:
    post:
      operationId: teacherMatching
      summary: Deterministic evidence-based teacher matching
      parameters:
        - $ref: "#/components/parameters/RequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [intent]
              properties:
                intent: {type: string}
                constraints:
                  type: object
                  additionalProperties: true
                max_results: {type: integer, minimum: 1, maximum: 20}
      responses:
        "200":
          description: Ranked professor recommendations with reasons and evidence
          headers:
            X-Request-ID: {$ref: "#/components/headers/RequestId"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "405": {$ref: "#/components/responses/MethodNotAllowed"}
        "500": {$ref: "#/components/responses/InternalServerError"}
  /ai/research-navigation/sessions:
    post:
      operationId: createResearchNavigationSession
      summary: Create or resume an isolated research navigation session
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "201":
          description: Active session for the caller
          headers:
            X-Request-ID: {$ref: "#/components/headers/RequestId"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "405": {$ref: "#/components/responses/MethodNotAllowed"}
        "500": {$ref: "#/components/responses/InternalServerError"}
  /ai/research-navigation/sessions/{id}/messages:
    post:
      operationId: createResearchNavigationMessage
      summary: Send a message within a specific isolated navigation session
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message: {type: string, maxLength: 4000}
                page_context:
                  type: object
                  additionalProperties: true
      responses:
        "201":
          description: User message and assistant reply persisted to the requested session
          headers:
            X-Request-ID: {$ref: "#/components/headers/RequestId"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "405": {$ref: "#/components/responses/MethodNotAllowed"}
        "500": {$ref: "#/components/responses/InternalServerError"}
  /ai/assistant/session:
    get:
      operationId: getAssistantSession
      summary: Read the current active floating Research Navigator session
      description: >-
        Returns the active persisted conversation for the authenticated user or
        anonymous browser session. If no active session exists, session is null
        and messages is empty. The endpoint does not expose other users'
        conversations.
      parameters:
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: Current active navigator session and messages
          headers:
            X-Request-ID: {$ref: "#/components/headers/RequestId"}
          content:
            application/json:
              schema:
                type: object
                required: [data, request_id]
                properties:
                  data: {$ref: "#/components/schemas/AssistantSessionEnvelope"}
                  request_id: {type: string}
        "405": {$ref: "#/components/responses/MethodNotAllowed"}
        "500": {$ref: "#/components/responses/InternalServerError"}
  /ai/assistant/messages:
    post:
      operationId: createAssistantMessage
      summary: Send a page-aware Research Navigator message
      description: >-
        Creates or resumes the caller's active navigator session. The supplied
        page_context is treated only as a hint; the backend re-checks object
        visibility before adding metadata to the prompt. Closing the drawer does
        not call this endpoint and does not end the session.
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message: {type: string, maxLength: 4000}
                page_context:
                  type: object
                  additionalProperties: true
      responses:
        "201":
          description: User message and assistant reply persisted
          headers:
            X-Request-ID: {$ref: "#/components/headers/RequestId"}
          content:
            application/json:
              schema:
                type: object
                required: [data, request_id]
                properties:
                  data:
                    type: object
                    required: [session, user_message, assistant_message, citations, page_context]
                    properties:
                      session: {$ref: "#/components/schemas/AssistantSession"}
                      user_message: {$ref: "#/components/schemas/AssistantMessage"}
                      assistant_message: {$ref: "#/components/schemas/AssistantMessage"}
                      citations:
                        type: array
                        items: {$ref: "#/components/schemas/AssistantCitation"}
                      page_context:
                        type: object
                        additionalProperties: true
                  request_id: {type: string}
        "400": {$ref: "#/components/responses/BadRequest"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "405": {$ref: "#/components/responses/MethodNotAllowed"}
        "500": {$ref: "#/components/responses/InternalServerError"}
  /graph/nodes/{id}/neighbors:
    get:
      operationId: getGraphNodeNeighbors
      summary: Read approved graph neighbors visible to the caller
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: Visible active source node and approved visible neighbors
          headers:
            X-Request-ID: {$ref: "#/components/headers/RequestId"}
        "404": {$ref: "#/components/responses/NotFound"}
        "405": {$ref: "#/components/responses/MethodNotAllowed"}
        "500": {$ref: "#/components/responses/InternalServerError"}
  /ai/assistant/end:
    post:
      operationId: endAssistantSession
      summary: End the current floating Research Navigator session
      description: >-
        Marks the caller's active session ended. Closing the UI with X is only a
        client-side collapse and must not call this endpoint.
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "200":
          description: Session end result
          headers:
            X-Request-ID: {$ref: "#/components/headers/RequestId"}
          content:
            application/json:
              schema:
                type: object
                required: [data, request_id]
                properties:
                  data:
                    type: object
                    required: [ended, session_id]
                    properties:
                      ended: {type: boolean}
                      session_id:
                        type: [string, "null"]
                        format: uuid
                  request_id: {type: string}
        "403": {$ref: "#/components/responses/Forbidden"}
        "405": {$ref: "#/components/responses/MethodNotAllowed"}
        "500": {$ref: "#/components/responses/InternalServerError"}
components:
  securitySchemes:
    sessionAuth:
      type: apiKey
      in: cookie
      name: sessionid
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: {type: string, format: uuid}
    RequestId:
      name: X-Request-ID
      in: header
      required: false
      description: >-
        Optional caller correlation ID. Unsupported characters are removed and
        values are capped at 128 characters; an ID is generated when absent.
      schema: {type: string, maxLength: 128}
    CsrfToken:
      name: X-CSRFToken
      in: header
      required: false
      description: Required for unsafe requests made with a Django session cookie.
      schema: {type: string}
  headers:
    RequestId:
      description: Correlation ID shared by the response payload and audit event.
      schema: {type: string, maxLength: 128}
  schemas:
    VisibilityScope:
      type: string
      enum: [public, student, teacher, admin]
    ResearchWork:
      type: object
      required: [id, work_type, title, abstract, year, language, status, visibility_scope]
      properties:
        id: {type: string, format: uuid}
        work_type: {type: string}
        title: {type: string}
        abstract: {type: string}
        year: {type: integer}
        language: {type: string}
        status: {type: string}
        visibility_scope: {$ref: "#/components/schemas/VisibilityScope"}
    AssistantSessionEnvelope:
      type: object
      required: [session, messages]
      properties:
        session:
          anyOf:
            - {$ref: "#/components/schemas/AssistantSession"}
            - type: "null"
        messages:
          type: array
          items: {$ref: "#/components/schemas/AssistantMessage"}
    AssistantSession:
      type: object
      required: [id, status, started_at, ended_at, last_context]
      properties:
        id: {type: string, format: uuid}
        status:
          type: string
          enum: [active, ended]
        started_at: {type: string, format: date-time}
        ended_at:
          type: [string, "null"]
          format: date-time
        last_context:
          type: object
          additionalProperties: true
    AssistantMessage:
      type: object
      required: [id, role, content, page_context, citations, created_at]
      properties:
        id: {type: string, format: uuid}
        role:
          type: string
          enum: [user, assistant]
        content: {type: string}
        page_context:
          type: object
          additionalProperties: true
        citations:
          type: array
          items: {$ref: "#/components/schemas/AssistantCitation"}
        created_at: {type: string, format: date-time}
    AssistantCitation:
      type: object
      required: [id, type, title, description]
      properties:
        id: {type: string}
        type: {type: string}
        title: {type: string}
        description: {type: string}
    Error:
      type: object
      required: [error_code, message, details, request_id]
      properties:
        error_code: {type: string}
        message: {type: string}
        details: {type: object, additionalProperties: true}
        request_id: {type: string}
  responses:
    BadRequest:
      description: Invalid request or document
      headers:
        X-Request-ID: {$ref: "#/components/headers/RequestId"}
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    Forbidden:
      description: Forbidden request, including CSRF failure with error_code CSRF_FAILED
      headers:
        X-Request-ID: {$ref: "#/components/headers/RequestId"}
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    NotFound:
      description: Missing or inaccessible resource; existence is not disclosed
      headers:
        X-Request-ID: {$ref: "#/components/headers/RequestId"}
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    MethodNotAllowed:
      description: HTTP method not allowed; the Allow header is preserved
      headers:
        X-Request-ID: {$ref: "#/components/headers/RequestId"}
        Allow:
          description: Methods supported by this resource.
          schema: {type: string}
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    InternalServerError:
      description: Non-sensitive internal server error
      headers:
        X-Request-ID: {$ref: "#/components/headers/RequestId"}
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    NotImplemented:
      description: Feature is intentionally deferred for this MVP phase
      headers:
        X-Request-ID: {$ref: "#/components/headers/RequestId"}
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
