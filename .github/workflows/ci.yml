name: CI

on:
  push:
  pull_request:

jobs:
  django-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python app/manage.py check --deploy
        env:
          DJANGO_DEBUG: "false"
          DJANGO_SECRET_KEY: ci-only-secret-key-not-used-outside-ci
          DJANGO_ALLOWED_HOSTS: testserver
          DATABASE_URL: sqlite:///${{ github.workspace }}/ci.sqlite3
          CELERY_TASK_ALWAYS_EAGER: "true"
      - run: python app/manage.py test
        env:
          DJANGO_SECRET_KEY: ci-test-key
          DJANGO_ALLOWED_HOSTS: testserver
          DATABASE_URL: sqlite:///${{ github.workspace }}/test.sqlite3
          CELERY_TASK_ALWAYS_EAGER: "true"
