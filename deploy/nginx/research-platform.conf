upstream research_platform_app {
    # Resolve this name through the private application network in production.
    server fin-app.internal:8000;
    keepalive 16;
}

server {
    listen 80;
    server_name research.example.edu;

    location /healthz {
        proxy_pass http://research_platform_app/healthz;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
    }

    location /static/ {
        alias /var/www/research-platform/static/;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # Never alias /protected-media/ to the upload directory. Downloads must
    # pass through Django's permission-checked view.
    location / {
        proxy_pass http://research_platform_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_read_timeout 120s;
        client_max_body_size 25m;
    }
}

