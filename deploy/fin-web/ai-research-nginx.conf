upstream ai_research_app {
    server 100.72.157.21:8030;
}

server {
    listen 80;
    server_name fin-web fin-web.tail0af4fe.ts.net 100.125.1.6 192.168.50.30 192.168.50.183 _;

    client_max_body_size 50m;

    proxy_connect_timeout 60s;
    proxy_send_timeout 180s;
    proxy_read_timeout 180s;

    # Canonical shared-host mount.  The trailing slash on proxy_pass strips
    # only this mount prefix before Django resolves the application route.
    location = /faib-fju-students-work-exibition-platform {
        return 308 /faib-fju-students-work-exibition-platform/;
    }

    location ^~ /faib-fju-students-work-exibition-platform/ {
        proxy_pass http://ai_research_app/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Forwarded-Ssl on;
        proxy_set_header X-Forwarded-Prefix /faib-fju-students-work-exibition-platform;
        proxy_redirect off;
    }

    # Preserve the legacy port-10000 root deployment during the transition.
    location / {
        proxy_pass http://ai_research_app;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port 10000;
        proxy_set_header X-Forwarded-Ssl on;
        proxy_redirect off;
    }
}
