{% if page_obj.paginator.num_pages > 1 %}<nav class="mt-4" aria-label="分頁"><ul class="pagination"><li class="page-item {% if not page_obj.has_previous %}disabled{% endif %}">{% if page_obj.has_previous %}<a class="page-link" href="?page={{ page_obj.previous_page_number }}&q={{ query|urlencode }}">上一頁</a>{% else %}<span class="page-link">上一頁</span>{% endif %}</li><li class="page-item disabled"><span class="page-link">{{ page_obj.number }} / {{ page_obj.paginator.num_pages }}</span></li><li class="page-item {% if not page_obj.has_next %}disabled{% endif %}">{% if page_obj.has_next %}<a class="page-link" href="?page={{ page_obj.next_page_number }}&q={{ query|urlencode }}">下一頁</a>{% else %}<span class="page-link">下一頁</span>{% endif %}</li></ul></nav>{% endif %}
