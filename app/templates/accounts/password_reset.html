{% extends "public_site/base.html" %}
{% block title %}重設密碼{% endblock %}
{% block content %}
<section class="container py-5 auth-panel">
  <h1 class="h2 mb-3">重設密碼</h1>
  <form method="post" class="metadata-panel">
    {% csrf_token %}
    {{ form.as_p }}
    <p><label>CAPTCHA token <input class="form-control" name="captcha_token"></label></p>
    <button class="btn btn-primary" type="submit">送出</button>
  </form>
</section>
{% endblock %}
