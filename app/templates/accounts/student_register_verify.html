{% extends "public_site/base.html" %}
{% block title %}驗證 OTP{% endblock %}
{% block content %}
<section class="container py-5 auth-panel">
  <h1 class="h2 mb-3">驗證輔仁信箱 OTP</h1>
  {% if form.non_field_errors %}<div class="alert alert-danger">{{ form.non_field_errors }}</div>{% endif %}
  <form method="post" class="metadata-panel">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="btn btn-primary" type="submit">完成註冊</button>
  </form>
</section>
{% endblock %}
